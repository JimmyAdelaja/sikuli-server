name: Publish Client Library & Release EXE

on:
  push:
    branches:
      - main

jobs:
  publish-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Maven & Java 21
        uses: s4u/setup-maven-action@v1.20.0
        with:
          java-version: 21
          settings-servers: |
            [{
                "id": "github",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
            },
            {
                "id": "github-snapshots",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
            }]

      - name: Build Fat JAR & Deploy Package
        run: mvn clean deploy -DskipTests

      - name: Create Java App Image with jpackage
        shell: powershell
        run: |
          $JAR_FILE = (Get-ChildItem -Path target -Filter "*-jar-with-dependencies.jar" | Select-Object -First 1).Name
          jpackage `
            --name "SikuliServerApp" `
            --input target `
            --main-jar $JAR_FILE `
            --type app-image `
            --java-options "--enable-native-access=ALL-UNNAMED" `
            --win-console `
            --dest dist

      - name: Install warp-packer
        run: cargo install warp-packer

      - name: Pack App Image into Single Portable EXE
        shell: powershell
        run: |
          warp-packer `
            --arch windows-x64 `
            --input_dir dist\SikuliServerApp `
            --exec SikuliServerApp.exe `
            --output target\SikuliServer.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: target/SikuliServer.exe