name: Publish Client Library & Release EXE

on:
  push:
    branches:
      - main

jobs:
  publish-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Maven & Java 21
        uses: s4u/setup-maven-action@v1.22.0
        with:
          java-version: 21
          settings-servers: |
            [{
                "id": "github",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
            },
            {
                "id": "github-snapshots",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
            }]

      - name: Set Maven version from run number
        run: mvn versions:set "-DnewVersion=1.${{ github.run_number }}" "-DgenerateBackupPoms=false"

      - name: Package JAR
        run: mvn clean package deploy -DskipTests

      - name: Create Java App Image with jpackage
        shell: powershell
        run: |
          ls target

          jpackage `
            --name "SikuliServerApp" `
            --input target `
            --main-jar sikuli-server-1.${{ github.run_number }}-jar-with-dependencies.jar `
            --type app-image `
            --java-options "--enable-native-access=ALL-UNNAMED" `
            --win-console `
            --dest dist

          echo "Results"
          ls
          ls dist
          ls dist\bin

      - name: Pack App Image into Single Portable EXE
        shell: powershell
        run: |
          # Download pre-built warp-packer executable from the official dgiagio/warp releases
          Invoke-WebRequest -Uri "https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe" -OutFile "warp-packer.exe"

          # Pack the app image into a single portable EXE
          .\warp-packer.exe `
            --arch windows-x64 `
            --input_dir dist\SikuliServerApp `
            --exec bin\SikuliServerApp.exe `
            --output target\SikuliServer.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.${{ github.run_number }}
          name: Release v1.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            target/SikuliServer.exe
            dist/bin/SikuliServerApp.exe
            target/sikuli-server-1.${{ github.run_number }}-jar-with-dependencies.jar
